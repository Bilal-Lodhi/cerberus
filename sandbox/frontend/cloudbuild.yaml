# ─────────────────────────────────────────────────────────────────────────────
# Cerberus AI — Frontend Cloud Build Configuration
# Flutter Web → Firebase Hosting
# ─────────────────────────────────────────────────────────────────────────────

steps:
  # Install Flutter SDK
  - name: "gcr.io/flutter-sdk/flutter:stable"
    entrypoint: bash
    args:
      - "-c"
      - |
        flutter pub get
        flutter build web \
          --dart-define=FIREBASE_API_KEY=${_FIREBASE_API_KEY} \
          --dart-define=FIREBASE_APP_ID=${_FIREBASE_APP_ID} \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID} \
          --dart-define=FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID} \
          --dart-define=API_BASE_URL=${_API_BASE_URL} \
          --release

  # Deploy to Firebase Hosting
  - name: "gcr.io/$PROJECT_ID/firebase"
    entrypoint: bash
    args:
      - "-c"
      - |
        firebase deploy --only hosting --project=${_FIREBASE_PROJECT_ID}

# Substitution variables (set via Cloud Build trigger or CLI)
substitutions:
  _FIREBASE_API_KEY: ""
  _FIREBASE_APP_ID: ""
  _FIREBASE_MESSAGING_SENDER_ID: ""
  _FIREBASE_PROJECT_ID: "webscraping-464710"
  _API_BASE_URL: "https://cerberus-api-35663052294.us-central1.run.app"

timeout: "900s"

options:
  logging: CLOUD_LOGGING_ONLY