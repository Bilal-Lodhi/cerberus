name: CI

# Runs on every pull request and on pushes to the default branch.
# No production secret is required: the test suite stubs the OpenAI endpoint
# and the MongoDB persistence adapter in-process, so CI never calls a paid API
# and never needs a live database.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────
  # TypeScript: install, build, typecheck, automated tests
  # ───────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript (build, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Documentation links and anchors
        run: npm run check:docs

      - name: Verify compiled entrypoints exist
        run: |
          test -f apps/api/dist/index.js
          test -f packages/mcp-mongodb/dist/http-adapter.js
          test -f packages/mcp-mongodb/dist/server.js

  # ───────────────────────────────────────────────────────────────────
  # Real MongoDB: the contract suite and the highest-risk state flows
  # ───────────────────────────────────────────────────────────────────
  #
  # The job above runs without a database, so the real-store halves of the contract suite
  # and the whole integration suite are **skipped there with a stated reason**. That is the
  # right default for a fast unit job, but a skip is not a pass — and this repository has
  # four recorded defects that its own suite could not see precisely because a double agreed
  # with the route and disagreed with the database.
  #
  # So this job provides a real `mongo:7` and sets `CERBERUS_TEST_MONGODB_URI`, which turns
  # every one of those skips into a run. It is **bounded** on purpose: a 20-minute timeout,
  # and it runs the test script rather than the full build matrix, so a hang is a failure
  # rather than an indefinitely green check.
  #
  # No paid AI: the provider boundary is stubbed exactly as the unit suite stubs it.
  integration:
    name: Integration (real MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CERBERUS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the database is reachable
        run: |
          # A service container that is not ready would make the suite *skip* rather than
          # fail, and a skipped suite is green for the wrong reason. This makes the
          # precondition explicit and fatal.
          node --input-type=module -e "
            import { MongoClient } from 'mongodb';
            const client = new MongoClient(process.env.CERBERUS_TEST_MONGODB_URI);
            await client.connect();
            const ok = (await client.db('admin').command({ ping: 1 })).ok;
            await client.close();
            if (ok !== 1) {
              console.error('MongoDB did not answer a ping');
              process.exit(1);
            }
            console.log('MongoDB is reachable');
          "

      - name: Contract and integration suites against real MongoDB
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/integration.log

      - name: Assert nothing was skipped
        run: |
          # The unit job is allowed to skip; this one is not. A silent skip here would mean
          # the integration suite stopped running — the failure this job exists to prevent —
          # so the recorded output is checked rather than trusted.
          if grep -qE '# SKIP' /tmp/integration.log; then
            echo "::error::a test was skipped in the integration job"
            grep -E '# SKIP' /tmp/integration.log
            exit 1
          fi
          echo "OK: no test was skipped against real MongoDB."

  # ───────────────────────────────────────────────────────────────────
  # Flutter console: analyze and test
  # ───────────────────────────────────────────────────────────────────
  console:
    name: Flutter console (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/console

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # `flutter analyze` does not check formatting, and the release checklist names
      # `dart format --set-exit-if-changed` as a gate. Without this step that gate was
      # documented but never enforced, so four files reached a release candidate
      # unformatted — two of them edited through a tool that wrote CRLF, which the
      # formatter rewrites. Enforcing it here is what makes the documented gate real.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test

  # ───────────────────────────────────────────────────────────────────
  # Docker: the documented container build must succeed
  # ───────────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cerberus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image starts and serves /health
        run: |
          # The image bakes ENV NODE_ENV=production, and dev mode is refused
          # outright under production, so the positive smoke path has to select
          # development explicitly. This does NOT weaken the production
          # fail-closed control: the negative test below still starts the image
          # with NODE_ENV=production and no credential and asserts it exits.
          docker run -d --name cerberus-ci \
            -e NODE_ENV=development \
            -e CERBERUS_DEV_MODE=true \
            -e OPENAI_API_KEY=ci-placeholder-not-a-real-key \
            -e MONGODB_URI=mongodb://127.0.0.1:27017 \
            -p 8080:8080 cerberus:ci

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "health endpoint responded"
              curl -s http://localhost:8080/health
              docker rm -f cerberus-ci
              exit 0
            fi
            sleep 2
          done

          echo "::error::the API did not answer /health within 60s"
          docker logs cerberus-ci
          docker rm -f cerberus-ci
          exit 1

      - name: Assert startup fails closed without a credential
        run: |
          set +e
          docker run --rm \
            -e NODE_ENV=production \
            -e OPENAI_API_KEY=ci-placeholder-not-a-real-key \
            -e MONGODB_URI=mongodb://127.0.0.1:27017 \
            cerberus:ci > /tmp/closed.log 2>&1
          code=$?
          set -e
          cat /tmp/closed.log
          if [ "$code" -eq 0 ]; then
            echo "::error::the API started without CERBERUS_API_KEY in production mode"
            exit 1
          fi
          grep -q "CERBERUS_API_KEY" /tmp/closed.log \
            || { echo "::error::expected a CERBERUS_API_KEY startup error"; exit 1; }

  # ───────────────────────────────────────────────────────────────────
  # Repository hygiene: no secrets, no stray credential files
  # ───────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TruffleHog needs a non-degenerate commit range. Comparing the default
      # branch against HEAD is degenerate on a push to that same branch — both
      # resolve to the pushed commit — which previously failed the job with
      # "BASE and HEAD commits are the same".
      #
      #   pull_request     -> PR base sha .. PR head sha
      #   push to main     -> previous tip (event.before) .. pushed tip
      #   initial push     -> no usable base, so scan the full history
      #   manual dispatch  -> full history
      #
      # The trufflehog GitHub Action is deliberately not used: it always emits
      # `--since-commit`, and an empty value makes the CLI abort with
      # "expected argument for flag '--since-commit'". That is exactly the
      # first-push case, which must be scanned rather than skipped.
      - name: Resolve secret-scan range
        id: scan_range
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"

          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.event.after }}"
              ;;
            *)
              base=""
              head=""
              ;;
          esac

          [ -n "$head" ] || head="$(git rev-parse HEAD)"

          # A usable base must exist, differ from head, and actually be an
          # ancestor of head. An all-zero "before" means a new branch, and a
          # force-push can leave the previous tip unreachable or divergent —
          # trufflehog then finds no merge base, exits 0 and scans ZERO chunks,
          # which would be a silent skip. Every such case falls back to a full
          # history scan instead.
          if [ -z "$base" ] || [ "$base" = "$zero" ] || [ "$base" = "$head" ] \
             || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null \
             || ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
            base=""
            echo "Secret-scan range: full history (no usable base commit)"
          else
            echo "Secret-scan range: ${base}..${head}"
          fi

          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      # Verified-secrets only: this mode has a very low false-positive rate,
      # which is what makes it safe to run as a required check.
      # Pinned to the version verified locally; bump deliberately.
      - name: Scan for verified secrets
        run: |
          set -euo pipefail
          base="${{ steps.scan_range.outputs.base }}"
          head="${{ steps.scan_range.outputs.head }}"

          args=(--branch "$head" --fail --no-update --only-verified)
          if [ -n "$base" ]; then
            args=(--since-commit "$base" "${args[@]}")
          fi

          docker run --rm -v "${{ github.workspace }}:/tmp" -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:3.97.5 \
            git file:///tmp/ "${args[@]}"

      - name: Reject committed credential files
        run: |
          set -e
          fail=0
          for pattern in '.env' 'application_default_credentials.json' '*.pem' '*.key'; do
            found=$(git ls-files -- "$pattern" | grep -v '\.env\.example' || true)
            if [ -n "$found" ]; then
              echo "::error::credential-shaped file is tracked: $found"
              fail=1
            fi
          done
          exit $fail

      # Retired deployment/product identifiers must not reappear in shippable
      # source or configuration.
      #
      # The historical names are referenced on purpose in the migration
      # documentation, in negative tests that assert those names are gone, and
      # in this workflow (which necessarily contains the pattern itself). Those
      # locations are excluded here rather than deleted: the migration history
      # is legitimate documentation, not leakage.
      - name: Reject unrelated deployment identity
        run: |
          set -euo pipefail
          pattern='webscraping-464710|gorilla_agents|gorilla-mcp-mongodb'

          excludes=(
            ':(exclude).github/**'
            ':(exclude)docs/**'
            ':(exclude)**/test/**'
            ':(exclude)**/tests/**'
          )

          # Sanity-check the scan set so a wrong pathspec cannot silently
          # turn this guard into a no-op.
          files=$(git ls-files -- . "${excludes[@]}" | wc -l)
          if [ "$files" -eq 0 ]; then
            echo "::error::retired-identity guard matched no files to scan"
            exit 1
          fi
          echo "Scanning $files files for retired deployment identifiers."

          if git grep -n -I -E "$pattern" -- . "${excludes[@]}"; then
            echo "::error::a retired deployment or product identifier is still present in source or configuration"
            exit 1
          fi

          echo "OK: no retired deployment identifier outside documentation and tests."

  # ───────────────────────────────────────────────────────────────────
  # Dependency advisories (advisory, non-blocking)
  # ───────────────────────────────────────────────────────────────────
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only: a transitive advisory should be visible, not block a
    # documentation or test-only pull request. Triage happens on a schedule.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Report full audit
        run: npm audit || true
